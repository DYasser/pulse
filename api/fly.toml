# Fly.io configuration.
#
# One machine, always on. A monitor that scales to zero stops monitoring, so the
# usual serverless default is exactly wrong here.

app = 'pulse-uptime'
primary_region = 'yyz' # Toronto

[build]
  dockerfile = 'Dockerfile'


[env]
  PORT = '3000'
  NODE_ENV = 'production'
  # One machine runs the worker. Scaling the API past one instance would need this
  # set to 'false' on the extras, or every monitor gets probed once per machine.
  WORKER_ENABLED = 'true'
  FAILURE_THRESHOLD = '2'
  JWT_EXPIRES_IN = '15m'

[http_service]
  internal_port = 3000
  force_https = true
  # Never suspend: the scheduler has to keep ticking whether or not anyone is
  # looking at the dashboard.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 200
    hard_limit = 250

# Fly restarts the machine if this fails, and /api/health touches the database -
# a process that cannot reach Postgres cannot serve anything useful.
[[http_service.checks]]
  interval = '30s'
  timeout = '5s'
  grace_period = '20s'
  method = 'GET'
  path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

# One machine, deliberately. Fly adds a second for high availability by default,
# and both would run the scheduler - every monitor probed twice, doubling traffic
# to the sites being watched and corrupting the uptime denominators. Scaling out
# safely needs WORKER_ENABLED=false on the extras, or claim-based scheduling with
# SELECT ... FOR UPDATE SKIP LOCKED.
# Migrations run once per deploy in their own short-lived machine, rather than
# racing across every instance on boot.
[deploy]
  release_command = 'npx prisma migrate deploy'
  max_unavailable = 1
